name: Lint

on:
  push:
    branches: [dev]

  pull_request:
    branches: [dev]

jobs:
  lint:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2.0.1
        name: Install pnpm
        with:
          version: 7

      # - name: Cache pnpm dependencies
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       node_modules
      #     key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.ymal') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          pnpm install

      - name: Lint
        run: |
          pnpm lint
